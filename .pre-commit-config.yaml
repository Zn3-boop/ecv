repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(package-lock\.json|\.env\.example|.*\.example$|\.secrets\.baseline$)'

  - repo: local
    hooks:
      - id: forbid-env-in-commit
        name: forbid .env files in commit
        entry: bash -c 'git diff --cached --name-only | grep -E "\.env$" && echo "ERROR: .env files must not be committed!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true