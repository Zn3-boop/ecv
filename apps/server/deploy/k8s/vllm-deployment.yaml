apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  labels:
    app: vllm
    component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      component: inference
  template:
    metadata:
      labels:
        app: vllm
        component: inference
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - "Qwen/Qwen2.5-7B-Instruct"
            - --served-model-name
            - "qwen2.5-7b-instruct"
            - --tensor-parallel-size
            - "1"
            - --gpu-memory-utilization
            - "0.90"
            - --max-num-seqs
            - "256"
            - --max-model-len
            - "8192"
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --kv-cache-dtype
            - "fp8_e5m2"
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
          ports:
            - containerPort: 8001
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 10
      nodeSelector:
        gpu-type: "a100"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
spec:
  selector:
    app: vllm
    component: inference
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP